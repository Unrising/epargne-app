<ion-header [translucent]="true" mode="ios">
  <ion-toolbar>
    <ion-title>Inscription</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content mode="ios">
  <div class="auth-shell">
    <section class="auth-panel">
      <p class="eyebrow">Nouveau compte</p>
      <h1>Creer ton espace budget.</h1>
      <p class="intro">Un compte permet de sauvegarder tes objectifs d'epargne et tes categories de depenses.</p>

      <div class="form-grid">
        <ion-item lines="none">
          <ion-input label="Email" labelPlacement="stacked" type="email" autocomplete="email" [(ngModel)]="credentials.email"></ion-input>
        </ion-item>
        <ion-item lines="none">
          <ion-input label="Mot de passe" labelPlacement="stacked" type="password" autocomplete="new-password" [(ngModel)]="credentials.password"></ion-input>
        </ion-item>
      </div>

      @if(message) {
        <p class="auth-message">{{ message }}</p>
      }

      <ion-button expand="block" color="dark" [disabled]="isLoading" (click)="register()">
        <ion-icon slot="start" name="person-add-outline"></ion-icon>
        Creer le compte
      </ion-button>

      <ion-button expand="block" fill="clear" color="dark" routerLink="/login">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Deja inscrit
      </ion-button>
    </section>
  </div>
</ion-content>
